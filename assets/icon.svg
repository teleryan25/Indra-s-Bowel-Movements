<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0" stop-color="#232f5c"/>
      <stop offset="0.55" stop-color="#121a36"/>
      <stop offset="1" stop-color="#090d1c"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.82" cy="0.12" r="0.75">
      <stop offset="0" stop-color="#7a7dff" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#7a7dff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="0.5" cy="0.78" r="0.45">
      <stop offset="0" stop-color="#e9b04f" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#e9b04f" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff1c9"/>
      <stop offset="0.45" stop-color="#f6d58c"/>
      <stop offset="1" stop-color="#d9982f"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#000" flood-opacity="0.45"/>
    </filter>
  </defs>
  <rect width="512" height="512" fill="url(#bg)"/>
  <rect width="512" height="512" fill="url(#glow)"/>
  <rect width="512" height="512" fill="url(#glow2)"/>
  <!-- faint operations grid -->
  <g stroke="#ffffff" stroke-opacity="0.05" stroke-width="2">
    <path d="M0 96H512M0 192H512M0 288H512M0 384H512M96 0V512M192 0V512M288 0V512M384 0V512"/>
  </g>
  <g id="emblem">
  <!-- the mark: a tiered swirl, rendered like a luxury emblem -->
  <g filter="url(#shadow)">
    <rect x="104" y="318" width="304" height="96" rx="48" fill="url(#gold)"/>
    <rect x="144" y="244" width="224" height="88" rx="44" fill="url(#gold)" stroke="#0e1530" stroke-opacity="0.35" stroke-width="5"/>
    <rect x="184" y="178" width="144" height="78" rx="39" fill="url(#gold)" stroke="#0e1530" stroke-opacity="0.35" stroke-width="5"/>
    <path d="M226 186 C 222 150, 262 128, 292 110 C 286 138, 300 156, 276 182 Z" fill="url(#gold)" stroke="#0e1530" stroke-opacity="0.3" stroke-width="4" stroke-linejoin="round"/>
  </g>
  <!-- highlights -->
  <g fill="url(#shine)" opacity="0.9">
    <rect x="140" y="328" width="150" height="16" rx="8"/>
    <rect x="176" y="254" width="104" height="14" rx="7"/>
    <rect x="208" y="188" width="62" height="12" rx="6"/>
  </g>
  <!-- sparkle -->
  <path d="M388 128 l10 26 26 10 -26 10 -10 26 -10 -26 -26 -10 26 -10z" fill="#fff1c9"/>
  <circle cx="134" cy="150" r="5" fill="#fff1c9" opacity="0.7"/>
  </g>
</svg>
